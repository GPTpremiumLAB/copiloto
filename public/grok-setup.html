<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurar Grok</title>
<style>body{margin:0;background:#111;color:#f5f5f2;font-family:Arial;display:grid;place-items:center;min-height:100vh}.card{width:min(480px,calc(100% - 36px));background:#eee7da;color:#171717;padding:30px;border-radius:22px}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #91897c;border-radius:10px;font:inherit}button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:11px;background:#111;color:#fff;font-weight:700}p{line-height:1.5}.status{min-height:24px}</style></head>
<body><form class="card" id="form"><h1>Conectar o Grok</h1><p>A chave será salva somente no arquivo privado do servidor.</p><label for="key">Chave da API xAI</label><input id="key" type="password" autocomplete="off" required><label for="model">Modelo</label><input id="model" value="grok-4.5" required><button>Salvar configuração</button><p class="status" id="status"></p></form>
<script>form.addEventListener('submit',async(e)=>{e.preventDefault();status.textContent='Salvando...';const response=await fetch('/local/setup/grok',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:key.value,model:model.value})});const data=await response.json();status.textContent=response.ok?'Grok conectado com sucesso.':(data.error||'Não foi possível configurar.');if(response.ok)key.value='';});</script></body></html>
